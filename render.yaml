services:
  - type: web
    name: oal-file-control
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: OPEN_BROWSER
        value: "0"
      - key: STORAGE_DIR
        value: /opt/render/project/src/storage
